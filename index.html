<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ingliz tili lug'ati — English File Units</title>
<!-- Favicon (EN yozuvli SVG logo) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%235B4CFF'/><stop offset='100%25' stop-color='%23FF6F91'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(%23g)'/><text x='50%25' y='55%25' font-family='system-ui,sans-serif' font-size='44' font-weight='800' fill='%23ffffff' text-anchor='middle' dominant-baseline='middle'>EN</text></svg>">
<style>
/* ===================== DESIGN TOKENS ===================== */
:root {
  --bg: #F6F5FB; --surface: #FFFFFF; --surface-2: #EFEDFB;
  --ink: #20203A; --ink-soft: #5B5B78; --border: rgba(32,32,58,0.10);
  
  --primary: #5B4CFF; 
  --primary-2: #8B5CF6; 
  --accent: #FF6F91;
  --accent-2: #00C6AE; 
  --grad-1: linear-gradient(135deg,#5B4CFF 0%,#8B5CF6 50%,#FF6F91 100%);
  --grad-2: linear-gradient(135deg,#00C6AE 0%,#5B4CFF 100%);
  
  --gold: #FFB020; --danger: #FF4D5E; --success: #1FBF75;
  --shadow: 0 8px 24px rgba(60,50,140,0.10); --shadow-lg: 0 16px 40px rgba(60,50,140,0.18);
  --radius: 18px; --radius-sm: 12px;
  --font-display: 'Golos Text','Segoe UI',system-ui,sans-serif;
  --font-body: 'Golos Text','Segoe UI',system-ui,sans-serif;
}
html.dark {
  --bg: #1D1D26; --surface: #262633; --surface-2: #323244;
  --ink: #F1F0FA; --ink-soft: #A8A6C6; --border: rgba(255,255,255,0.08);
  --shadow: 0 8px 24px rgba(0,0,0,0.35); --shadow-lg: 0 16px 40px rgba(0,0,0,0.5);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* GLOBAL SILLIQ O'TISHLAR */
body, .app, .cat-card, .phrase-card, .topbar, .bottom-nav, .modal-content, .btn, .stat-card, input, .mobile-menu {
  transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease, transform 0.3s ease;
}
body { margin: 0; font-family: var(--font-body); background: var(--bg); color: var(--ink); }
h1, h2, h3 { font-family: var(--font-display); margin: 0; }
button { font-family: inherit; cursor: pointer; }
input, select { font-family: inherit; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

/* LAYOUT */
.app { max-width: 1200px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; position: relative; padding-bottom: 76px; }
@media (min-width: 992px) { .app { padding-bottom: 20px; } }

/* YUQORI QISM (Header) */
.topbar { position: sticky; top: 0; z-index: 60; background: var(--grad-1); box-shadow: var(--shadow-lg); color: #fff; padding: 12px 20px; border-radius: 0 0 20px 20px; transition: background 0.4s ease; }
.topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

/* HOVER MOTION EFFECT UCHUN KODLAR */
.brand, .desktop-nav .nav-btn, .icon-btn, #show-auth-btn { transition: all 0.3s ease; }
@media (min-width: 992px) {
  .brand:hover, .desktop-nav .nav-btn:hover, .icon-btn:hover, #show-auth-btn:hover {
    transform: translateY(-3px);
  }
  .desktop-nav .nav-btn:hover { background: rgba(255,255,255,0.25); color: #fff; border-radius: 10px; }
  .icon-btn:hover { background: rgba(255,255,255,0.25); }
  #show-auth-btn:hover { box-shadow: 0 6px 15px rgba(0,0,0,0.2); }
}

.brand { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.brand-text h1 { font-size: 16px; font-weight: 800; letter-spacing: .2px; }
.brand-text p { display: none; }

/* DESKTOP NAVBAR */
.desktop-nav { display: none; align-items: center; gap: 5px; flex: 1; justify-content: center; }
.desktop-nav .nav-btn { flex-direction: row; color: rgba(255,255,255,0.8); font-size: 14px; padding: 8px 14px; }
.desktop-nav .nav-btn.active { color: #fff; background: rgba(255,255,255,0.2); border-radius: 10px; }
.desktop-nav .nav-btn .em { margin-right: 6px; font-size: 16px; }

/* O'NG TOMON TUFMAYALAR VA QIDIRUV */
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.search-container { display: flex; align-items: center; background: rgba(255,255,255,0.15); border-radius: 20px; padding: 2px; transition: 0.3s; }
.search-container.active { background: rgba(255,255,255,0.95); }
.search-input { width: 0; padding: 0; border: none; background: transparent; font-size: 14px; transition: 0.3s; opacity: 0; color: #20203A; }
.search-container.active .search-input { width: 140px; padding: 5px 10px; opacity: 1; outline: none; }
.icon-btn { width: 34px; height: 34px; border-radius: 10px; background: transparent; color: #fff; border: none; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.search-container.active .icon-btn { color: var(--primary); }

/* GAMBURGER MENYU VA MOBILE AUTH */
.hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 5px; z-index: 100; width: 34px; height: 34px; align-items: center; justify-content: center; }
.hamburger span { display: block; width: 22px; height: 3px; background: #fff; transition: 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); border-radius: 3px; }
.hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 6px); }
.hamburger.active span:nth-child(2) { opacity: 0; }
.hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -6px); }

.mobile-menu { position: absolute; top: 60px; right: 20px; background: var(--surface); padding: 15px; border-radius: 12px; box-shadow: var(--shadow-lg); display: none; flex-direction: column; gap: 10px; z-index: 100; border: 1px solid var(--border); transform-origin: top right; animation: scaleIn 0.2s ease forwards; }
.mobile-menu.active { display: flex; }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
.auth-controls { display: flex; align-items: center; gap: 10px; }
#user-info { font-weight: bold; color: var(--success); display: none; font-size: 14px; }

@media (max-width: 991px) {
  .hamburger { display: flex; }
  .desktop-auth-wrapper { display: none; }
}
@media (min-width: 992px) {
  .desktop-nav { display: flex; }
  .bottom-nav { display: none !important; }
  .mobile-menu { display: flex !important; position: static; background: transparent; box-shadow: none; border: none; padding: 0; flex-direction: row; animation: none; }
  .search-container.active .search-input { width: 200px; }
}

/* RANGLAR PANELI (Theme Switcher) */
.color-switcher { position: fixed; right: 0; top: 50%; transform: translateY(-50%); background: var(--surface); padding: 12px 8px; border-radius: 16px 0 0 16px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 12px; z-index: 1000; border: 1px solid var(--border); border-right: none; }
.c-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface-2); cursor: pointer; transition: 0.3s; padding: 0; }
.c-dot.active { transform: scale(1.2); border-color: var(--ink); box-shadow: 0 0 8px rgba(0,0,0,0.2); }

/* MAIN VIEW SLIDE-UP ANIMATSIYASI */
.view { padding: 20px; animation: slideFadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
@keyframes slideFadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

/* GRID VA RESPONSIV KARTALAR */
.section-title { font-size: 16px; font-weight: 800; margin: 10px 2px 14px; display: flex; align-items: center; gap: 8px; }
.section-title .cnt { font-weight: 600; font-size: 11.5px; color: var(--ink-soft); background: var(--surface-2); padding: 3px 9px; border-radius: 100px; }

.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (min-width: 768px) { .cat-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 992px) { .cat-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }

.cat-card { background: var(--surface); border-radius: var(--radius-sm); padding: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); text-align: left; display: flex; flex-direction: column; gap: 10px; color: var(--ink); }
.cat-emoji { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; background: var(--surface-2); }
.cat-name { font-size: 14px; font-weight: 700; line-height: 1.3; }

.dash-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
@media (min-width: 768px) { .dash-cards { grid-template-columns: repeat(4, 1fr); } }

.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; box-shadow: var(--shadow); }
.stat-card b { font-size: 24px; display: block; }
.progress-bar { height: 8px; border-radius: 10px; background: var(--surface-2); overflow: hidden; margin-top: 10px; }
.progress-fill { height: 100%; background: var(--grad-2); border-radius: 10px; transition: width 0.6s ease; }

/* TEZKOR MENYULAR QISMI (Hover kesilishini oldini olish uchun padding-top qo'shildi) */
.quick-row { display: flex; gap: 12px; overflow-x: auto; padding: 10px 5px 15px 5px; margin: 0 -5px 20px -5px; }
.quick-btn { flex: 0 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 100px; box-shadow: var(--shadow); font-size: 12px; font-weight: 700; color: var(--ink); }
.quick-btn .em { font-size: 22px; }

/* LUG'AT KARTOCHKALARI */
.phrases-list { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 768px) { .phrases-list { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 992px) { .phrases-list { grid-template-columns: repeat(3, 1fr); gap: 16px; } }

.phrase-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; box-shadow: var(--shadow); position: relative; display: flex; flex-direction: column; justify-content: center; }
.phrase-uz { font-size: 11.5px; color: var(--primary); font-weight: 800; text-transform: uppercase; letter-spacing: .3px; margin-bottom: 6px; transition: color 0.4s ease; }
.phrase-ru { font-size: 17px; font-weight: 800; line-height: 1.35; margin-bottom: 4px; }
.phrase-tr { font-size: 13.5px; color: var(--ink-soft); font-weight: 600; margin-bottom: 4px; display: flex; align-items: flex-start; gap: 6px; }
.phrase-tr .flag-em { font-size: 16px; line-height: 1; }
.phrase-note { font-size: 12px; color: var(--accent-2); font-weight: 600; margin-top: 6px; }
.phrase-actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; }
.mini-btn { width: 34px; height: 34px; border-radius: 10px; border: none; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--ink-soft); }
.mini-btn.fav-on { color: var(--gold); background: rgba(255,176,32,0.15); }

/* KARTALAR UCHUN HOVER EFFEKTLARI */
@media (min-width: 992px) {
  .cat-card:hover, .stat-card:hover, .quick-btn:hover { transform: translateY(-5px) scale(1.02); box-shadow: var(--shadow-lg); border-color: var(--primary-2); }
  .phrase-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); filter: brightness(1.1); }
  .opt-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--surface-2); transform: translateX(5px); }
  .mode-card:hover { border-color: var(--primary-2); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
}

/* PASTKI MENYU (Mobil) */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 4px calc(8px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 20px rgba(0,0,0,0.06); }
.nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink-soft); font-size: 10px; font-weight: 700; padding: 6px; border-radius: 12px; flex: 1; transition: 0.3s; }
.nav-btn .em { font-size: 20px; }
.nav-btn.active { color: var(--primary); background: var(--surface-2); }

/* UMUMIY ELEMENTLAR */
.btn { padding: 14px 22px; border-radius: 14px; border: none; font-weight: 800; font-size: 15px; background: var(--grad-1); color: #fff; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; }
.btn:active { transform: scale(0.97); }
.btn.secondary { background: var(--surface-2); color: var(--ink); box-shadow: none; border: 1px solid var(--border); }
.btn.danger { background: linear-gradient(135deg,#FF4D5E,#FF6F91); }
.btn.success { background: linear-gradient(135deg,#1FBF75,#00C6AE); }
.btn.block { width: 100%; }

/* MODAL OYNA (Login) */
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(4px); }
.modal-content { background: var(--surface); padding: 30px; border-radius: 20px; width: 90%; max-width: 380px; box-shadow: var(--shadow-lg); position: relative; animation: slideFadeUp 0.3s ease; border: 1px solid var(--border); }
.modal-content input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--ink); font-size: 15px; outline: none; transition: 0.3s; }
.modal-content input:focus { border-color: var(--primary); }
.modal-content button { padding: 14px; margin: 8px 0; width: 100%; cursor: pointer; border: none; border-radius: 12px; font-weight: 800; color: white; font-size: 15px; transition: 0.3s; }
#login-btn { background: var(--success); }
#signup-btn { background: var(--primary); }
.close-btn { position: absolute; top: 12px; right: 18px; cursor: pointer; font-size: 24px; font-weight: bold; color: var(--ink-soft); transition: 0.3s; }
.close-btn:hover { color: var(--danger); transform: rotate(90deg); }
#auth-error { color: var(--danger); font-size: 14px; text-align: center; margin-bottom: 10px; font-weight: 600; }

/* BOSHQA (Quiz, Flashcard qismlari) */
.flash-wrap, .quiz-setup, .q-card { width: 100%; max-width: 600px; margin: 0 auto; }
.flashcard { width: 100%; min-height: 280px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow-lg); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 22px; position: relative; }
.flash-main { font-size: 26px; font-weight: 800; line-height: 1.4; }
.flash-bottom { display: flex; gap: 15px; margin-top: 20px; width: 100%; }

.mode-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 20px; }
@media (min-width: 500px) { .mode-grid { grid-template-columns: 1fr 1fr; } }
.mode-card { background: var(--surface); border: 2px solid var(--border); border-radius: 16px; padding: 16px; text-align: left; display: flex; flex-direction: column; gap: 6px; transition: 0.3s; cursor: pointer; color: var(--ink); box-shadow: var(--shadow); }
.mode-card.sel { border-color: var(--primary); background: rgba(91, 76, 255, 0.05); box-shadow: 0 0 0 1px var(--primary); }
.mode-card .em { font-size: 22px; display: inline-block; }
.mode-card b { font-size: 15px; font-weight: 800; }
.mode-card small { font-size: 13px; color: var(--ink-soft); }

.len-row { display: flex; gap: 8px; flex-wrap: wrap; }
.len-chip { padding: 10px 16px; border-radius: 100px; border: 2px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 700; color: var(--ink); transition: 0.3s; cursor: pointer; }
.len-chip.sel { border-color: var(--primary); background: var(--primary); color: #fff; }
.q-card { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow-lg); border: 1px solid var(--border); padding: 40px 30px; text-align: center; }

.q-options { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
/* Sichqoncha test javoblari ichidagi textni belgilamasligi uchun xavfsizlik */
.opt-btn { width: 100%; padding: 16px 20px; border-radius: 14px; border: 2px solid var(--border); background: var(--surface); text-align: left; font-size: 16px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 16px; transition: 0.3s; cursor: pointer; }
.opt-btn * { pointer-events: none; }
.opt-btn .letter { width: 30px; height: 30px; border-radius: 8px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; flex: 0 0 auto; color: var(--ink-soft); }
.opt-btn.correct { border-color: var(--success); background: rgba(31,191,117,0.12); }
.opt-btn.wrong { border-color: var(--danger); background: rgba(255,77,94,0.12); }

.tag-row { display: flex; gap: 8px; flex-wrap: wrap; max-height: 220px; overflow-y: auto; align-content: flex-start; }
.tag-chip { padding: 8px 14px; border-radius: 100px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; transition: 0.3s; cursor: pointer; }
.tag-chip.sel { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: var(--shadow); }
.back-row { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.back-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--ink); transition: 0.3s; cursor: pointer; }
.back-btn:hover { background: var(--surface-2); transform: translateX(-3px); }
</style>
</head>
<body>

<!-- RANGLAR PANELI (THEME SWITCHER) -->
<div class="color-switcher">
  <button class="c-dot" data-c="0" style="background: linear-gradient(135deg,#5B4CFF,#FF6F91);" title="Binafsharang (Asosiy)"></button>
  <button class="c-dot" data-c="1" style="background: linear-gradient(135deg,#007AFF,#00C6AE);" title="Moviy"></button>
  <button class="c-dot" data-c="2" style="background: linear-gradient(135deg,#34C759,#32ADE6);" title="Yashil"></button>
  <button class="c-dot" data-c="3" style="background: linear-gradient(135deg,#FF9500,#FF2D55);" title="Olovrang"></button>
</div>

<!-- MODAL OYNA (Login/Ro'yxatdan o'tish) -->
<div class="modal" id="auth-modal">
    <div class="modal-content">
        <span class="close-btn" id="close-modal-btn">&times;</span>
        <h3 style="margin-top: 0; margin-bottom: 15px; color: var(--ink);">Tizimga kirish</h3>
        <input type="email" id="email" placeholder="Email manzilingiz" required>
        <input type="password" id="password" placeholder="Parol (kamida 6 ta belgi)" required>
        <p id="forgot-password" style="font-size:12px; color:var(--primary); cursor:pointer; text-align:right; margin-top:-2px; margin-bottom:12px; font-weight:600;">Parolni unutdingizmi?</p>
        <p id="auth-error"></p>
        <button id="login-btn">Kirish</button>
        <button id="signup-btn">Ro'yxatdan o'tish</button>
        
        <div style="display: flex; align-items: center; text-align: center; margin: 15px 0;">
            <hr style="flex: 1; border: none; border-top: 1px solid var(--border);">
            <span style="padding: 0 10px; font-size: 12px; color: var(--ink-soft); font-weight: 600;">YOKI</span>
            <hr style="flex: 1; border: none; border-top: 1px solid var(--border);">
        </div>
        
        <button id="google-btn" style="background: #ffffff; color: #20203A; border: 1px solid #ddd; padding: 14px; margin: 8px 0; width: 100%; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s;">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width: 20px;"> Google orqali kirish
        </button>
    </div>
</div>

<div class="app" id="app">
  
  <!-- YUQORI NAVBAR -->
  <div class="topbar">
    <div class="topbar-row">
      <!-- Logo: SVG qilingan logotip -->
      <div class="brand" onclick="go('home')">
        <div class="brand-mark" style="background: transparent; padding: 0;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="34" height="34" style="filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));">
            <defs>
              <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="var(--primary)"/>
                <stop offset="100%" stop-color="var(--accent)"/>
              </linearGradient>
            </defs>
            <rect width="100" height="100" rx="24" fill="url(#logo-grad)"/>
            <text x="50%" y="55%" font-family="system-ui, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">EN</text>
          </svg>
        </div>
        <div class="brand-text"><h1>Ingliz tili</h1></div>
      </div>
      
      <!-- Desktop Menyular -->
      <div class="desktop-nav">
        <button class="nav-btn active" data-view="home"><span class="em">🏠</span>Bosh sahifa</button>
        <button class="nav-btn" data-view="categories"><span class="em">📘</span>Lug'atlar</button>
        <button class="nav-btn" data-view="rclist"><span class="em">📖</span>Reading</button>
        <button class="nav-btn" data-view="flash"><span class="em">🃏</span>Mashq</button>
        <button class="nav-btn" data-view="quiz"><span class="em">📝</span>Test</button>
        <button class="nav-btn" data-view="favorites"><span class="em">⭐</span>Sevimli</button>

<!-- LUG'ATLAR BAZASI -->
<script src="words.js?v=2.0.0"></script>

<script>
PHRASES.forEach((p,i)=>{ p.id = i; });
const CAT_MAP = Object.fromEntries(CATEGORIES.map(c=>[c.key,c]));

// ================= RANG PALITRALARI =================
const COLOR_PALETTES = [
  // 0: Asosiy (Binafsharang)
  { p: '#5B4CFF', p2: '#8B5CF6', a: '#FF6F91', a2: '#00C6AE', g1: 'linear-gradient(135deg,#5B4CFF 0%,#8B5CF6 50%,#FF6F91 100%)', g2: 'linear-gradient(135deg,#00C6AE 0%,#5B4CFF 100%)' },
  // 1: Moviy (Blue)
  { p: '#007AFF', p2: '#3399FF', a: '#00C6AE', a2: '#34C759', g1: 'linear-gradient(135deg,#007AFF 0%,#5856D6 100%)', g2: 'linear-gradient(135deg,#34C759 0%,#007AFF 100%)' },
  // 2: Yashil (Green)
  { p: '#34C759', p2: '#32ADE6', a: '#FFCC00', a2: '#007AFF', g1: 'linear-gradient(135deg,#34C759 0%,#32ADE6 100%)', g2: 'linear-gradient(135deg,#FFCC00 0%,#34C759 100%)' },
  // 3: Olovrang (Orange)
  { p: '#FF9500', p2: '#FF2D55', a: '#FFCC00', a2: '#FF3B30', g1: 'linear-gradient(135deg,#FF9500 0%,#FF2D55 100%)', g2: 'linear-gradient(135deg,#FFCC00 0%,#FF9500 100%)' }
];

// Asl V1 kalitiga qaytarildi (Yo'qolgan progress va sevimllarni qaytarish uchun)
const LS_KEY = "eng_vocab_state_v1"; 

function loadState(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return { favorites:{}, srs:{}, quizzesTaken:0, quizScoresSum:0, quizScoresCount:0, theme:"light", colorIdx: 0, lastActiveDate:null, streak:0 };
}
let STATE = loadState();
if(typeof STATE.colorIdx === 'undefined') STATE.colorIdx = 0;

function applyColorPalette(idx) {
  if (idx < 0 || idx >= COLOR_PALETTES.length) idx = 0;
  const pal = COLOR_PALETTES[idx];
  const root = document.documentElement;
  
  root.style.setProperty('--primary', pal.p);
  root.style.setProperty('--primary-2', pal.p2);
  root.style.setProperty('--accent', pal.a);
  root.style.setProperty('--accent-2', pal.a2);
  root.style.setProperty('--grad-1', pal.g1);
  root.style.setProperty('--grad-2', pal.g2);
  
  document.querySelectorAll('.c-dot').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.c) === idx);
  });
  
  STATE.colorIdx = idx;
  localStorage.setItem(LS_KEY, JSON.stringify(STATE));
}

document.querySelectorAll('.c-dot').forEach(btn => {
  btn.addEventListener('click', () => applyColorPalette(parseInt(btn.dataset.c)));
});

// Mahalliy va Bulut bazasiga saqlash
function saveState(){ 
  localStorage.setItem(LS_KEY, JSON.stringify(STATE)); 
  if (window.syncToFirestore) { window.syncToFirestore(); }
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function bumpStreak(){
  const t = todayStr();
  if(STATE.lastActiveDate === t) return;
  if(STATE.lastActiveDate){
    const prev = new Date(STATE.lastActiveDate);
    const now = new Date(t);
    const diffDays = Math.round((now-prev)/86400000);
    STATE.streak = (diffDays===1) ? (STATE.streak+1) : 1;
  } else { STATE.streak = 1; }
  STATE.lastActiveDate = t;
  saveState();
}
bumpStreak();

if(STATE.theme === "dark"){ document.documentElement.classList.add("dark"); }
applyColorPalette(STATE.colorIdx);

function applyThemeIcon(){ document.getElementById("themeBtn").textContent = STATE.theme==="dark" ? "☀️" : "🌙"; }

const SRS_INTERVALS_MIN = [10, 60, 60*8, 60*24, 60*24*3, 60*24*7, 60*24*16, 60*24*30];
function getSrs(id){ return STATE.srs[id] || {box:0, next:0}; }
function markKnown(id){
  const s = getSrs(id); s.box = Math.min(s.box+1, SRS_INTERVALS_MIN.length-1);
  s.next = Date.now() + SRS_INTERVALS_MIN[s.box]*60000;
  STATE.srs[id] = s; saveState();
}
function markUnknown(id){
  const s = getSrs(id); s.box = 0; s.next = Date.now() + SRS_INTERVALS_MIN[0]*60000;
  STATE.srs[id] = s; saveState();
}
function isLearned(id){ return getSrs(id).box >= 3; }
function isMemorized(id){ return getSrs(id).box >= 5; }
function dueForReview(id){ const s = getSrs(id); return s.box>0 && s.next <= Date.now(); }

let EN_VOICE = null;
function pickVoice(){
  const voices = speechSynthesis.getVoices();
  EN_VOICE = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("en-gb")) || voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("en")) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-GB"; if(EN_VOICE) u.voice = EN_VOICE; u.rate = 0.92;
  speechSynthesis.speak(u);
}

// UI LOGIC
const hamburgerBtn = document.getElementById('hamburgerBtn');
const mobileMenu = document.getElementById('mobileMenu');
hamburgerBtn.addEventListener('click', () => {
    hamburgerBtn.classList.toggle('active');
    mobileMenu.classList.toggle('active');
});

const searchContainer = document.getElementById('searchContainer');
const searchToggleBtn = document.getElementById('searchToggleBtn');
const searchInput = document.getElementById('globalSearch');
searchToggleBtn.addEventListener('click', () => {
    searchContainer.classList.toggle('active');
    if(searchContainer.classList.contains('active')) searchInput.focus();
});

let VIEW = "home";
let VIEW_PARAMS = {};
const mainView = document.getElementById("mainView");

function go(view, params={}, fromSearch=false){
  VIEW = view; VIEW_PARAMS = params;
  document.querySelectorAll(".nav-btn").forEach(b=>{
    b.classList.toggle("active", b.dataset.view === (["home","categories","rclist","flash","quiz","favorites","stats"].includes(view)?view:""));
  });
  
  hamburgerBtn.classList.remove('active');
  mobileMenu.classList.remove('active');
  
  if(!fromSearch) {
      searchContainer.classList.remove('active');
      searchInput.value = '';
  }
  
  render();
  if(!fromSearch) { window.scrollTo({top:0, behavior:"smooth"}); }
}

window.goView = go;

document.querySelectorAll(".nav-btn").forEach(btn=>{ btn.addEventListener("click", ()=> go(btn.dataset.view)); });
document.getElementById("themeBtn").addEventListener("click", ()=>{
  STATE.theme = STATE.theme==="dark" ? "light" : "dark";
  document.documentElement.classList.toggle("dark", STATE.theme==="dark");
  applyThemeIcon(); saveState();
});
applyThemeIcon();

searchInput.addEventListener("input", ()=>{
  if(searchInput.value.trim().length>0) go("search", {q:searchInput.value.trim()}, true);
  else if(VIEW==="search") go("home", {}, true);
});

function esc(s){ return (s||"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function norm(s){ return (s||"").toLowerCase().replace(/[ʼ'`’]/g,"'").trim(); }
function searchPhrases(q){
  const nq = norm(q); if(!nq) return [];
  return PHRASES.filter(p=> norm(p.en).includes(nq) || norm(p.uz).includes(nq) || norm(p.ru).includes(nq) ).slice(0,200);
}

// BAYROQCHALAR QO'SHILDI
function phraseCardHtml(p){
  const fav = !!STATE.favorites[p.id];
  return `
  <div class="phrase-card" data-id="${p.id}">
    <div class="phrase-actions">
      <button class="mini-btn speak-btn" data-id="${p.id}" title="Ovoz">🔊</button>
      <button class="mini-btn fav-btn ${fav?'fav-on':''}" data-id="${p.id}" title="Sevimli">${fav?'★':'☆'}</button>
    </div>
    <div class="phrase-uz">ENGLISH</div>
    <div class="phrase-ru">${esc(p.en)}</div>
    <div class="phrase-tr"><span class="flag-em">🇺🇿</span> <span>${esc(p.uz)}</span></div>
    ${p.ru ? `<div class="phrase-tr"><span class="flag-em">🇷🇺</span> <span>${esc(p.ru)}</span></div>` : ``}
    ${p.note ? `<div class="phrase-note">💡 ${esc(p.note)}</div>` : ``}
  </div>`;
}

function attachPhraseCardEvents(container){
  container.querySelectorAll(".speak-btn").forEach(b=>{ b.addEventListener("click",(e)=>{ e.stopPropagation(); speak(PHRASES[+b.dataset.id].en); }); });
  container.querySelectorAll(".fav-btn").forEach(b=>{
    b.addEventListener("click",(e)=>{
      e.stopPropagation(); const id = +b.dataset.id;
      if(STATE.favorites[id]) delete STATE.favorites[id]; else STATE.favorites[id] = true;
      saveState(); b.classList.toggle("fav-on"); b.textContent = STATE.favorites[id] ? "★" : "☆";
    });
  });
}

function render(){
  if(VIEW==="home") return renderHome();
  if(VIEW==="categories") return renderCategories();
  if(VIEW==="rclist") return renderRCList();
  if(VIEW==="catDetail") return renderCatDetail(VIEW_PARAMS.key);
  if(VIEW==="search") return renderSearch(VIEW_PARAMS.q);
  if(VIEW==="favorites") return renderFavorites();
  if(VIEW==="flash") return renderFlashSetup();
  if(VIEW==="flashRun") return renderFlashRun();
  if(VIEW==="quiz") return renderQuizSetup();
  if(VIEW==="quizRun") return renderQuizRun();
  if(VIEW==="quizResult") return renderQuizResult();
  if(VIEW==="stats") return renderStats();
}

function backRow(title){ return `<div class="back-row"><button class="back-btn" id="backBtn">←</button><h2 style="font-size:18px;font-weight:800;">${esc(title)}</h2></div>`; }

function renderHome(){
  const total = PHRASES.length;
  const learned = PHRASES.filter(p=>isLearned(p.id)).length;
  const memorized = PHRASES.filter(p=>isMemorized(p.id)).length;
  const favCount = Object.keys(STATE.favorites).length;
  const pct = total? Math.round((learned/total)*100):0;
  const seedStr = todayStr();
  let seed = 0; for(const ch of seedStr) seed += ch.charCodeAt(0);
  const notLearned = PHRASES.filter(p=>getSrs(p.id).box===0);
  const dailyNew = shuffleSeeded(notLearned, seed).slice(0,10);

  mainView.innerHTML = `
  <div class="view">
    <div class="dash-cards">
      <div class="stat-card"><b>${total}</b><span>Jami so'z/iboralar</span></div>
      <div class="stat-card"><b>${learned}</b><span>O'rganilgan</span><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>
      <div class="stat-card"><b>${memorized}</b><span>Yod bo'lgan</span></div>
      <div class="stat-card"><b>${favCount}</b><span>Sevimlilar ⭐</span></div>
    </div>
    <div class="quick-row">
      <button class="quick-btn" id="qbRandom"><span class="em">🎲</span>Tasodifiy so'z</button>
      <button class="quick-btn" id="qbDaily"><span class="em">☀️</span>Bugungi 10 ta</button>
      <button class="quick-btn" id="qbReview"><span class="em">🔁</span>Qayta o'rganish</button>
      <button class="quick-btn" id="qbDaily20"><span class="em">📝</span>Kunlik 20 test</button>
      <button class="quick-btn" id="qbExam50"><span class="em">🎓</span>50 savollik</button>
      <button class="quick-btn" id="qbExamAll"><span class="em">🏆</span>Katta imtihon</button>
    </div>
    <div class="section-title" style="margin-top:14px;">📘 Lug'atlar bo'limi</div>
    <div class="cat-grid">${CATEGORIES.filter(c=>c.type==='ef').map(catCardHtml).join("")}</div>
    <div class="section-title" style="margin-top:24px;">📖 Reading Challenge</div>
    <div class="cat-grid">${CATEGORIES.filter(c=>c.type==='rc').map(catCardHtml).join("")}</div>
    <div class="section-title" style="margin-top:24px;">🎲 Bugungi so'z</div>
    <div class="phrases-list" style="grid-template-columns: 1fr;">${phraseCardHtml(dailyPhrase())}</div>
  </div>`;

  attachPhraseCardEvents(mainView);
  document.getElementById("qbRandom").addEventListener("click", ()=> go("flashRun", {ids:[PHRASES[Math.floor(Math.random()*PHRASES.length)].id], single:true}));
  document.getElementById("qbDaily").addEventListener("click", ()=> go("flashRun", {ids: dailyNew.map(p=>p.id)}));
  document.getElementById("qbReview").addEventListener("click", ()=>{
    const due = PHRASES.filter(p=>dueForReview(p.id));
    if(due.length===0){ alert("Hozircha takrorlash uchun so'z yo'q. Avval kartochkalar bilan mashq qiling!"); return; }
    go("flashRun", {ids: due.map(p=>p.id)});
  });
  document.getElementById("qbDaily20").addEventListener("click", ()=> startQuiz({mode:"mixed", count:20, catKeys:[]}));
  document.getElementById("qbExam50").addEventListener("click", ()=> startQuiz({mode:"mixed", count:50, catKeys:[]}));
  document.getElementById("qbExamAll").addEventListener("click", ()=> startQuiz({mode:"mixed", count:PHRASES.length, catKeys:[]}));
  mainView.querySelectorAll(".cat-card").forEach(c=>{ c.addEventListener("click", ()=> go("catDetail",{key:c.dataset.key})); });
}

function dailyPhrase(){
  const seedStr = todayStr(); let seed=0; for(const ch of seedStr) seed += ch.charCodeAt(0)*7;
  return PHRASES[seed % PHRASES.length];
}

function shuffleSeeded(arr, seed){
  const a = arr.slice(); let s = seed || 1;
  function rnd(){ s = (s*9301+49297)%233280; return s/233280; }
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function catCardHtml(c){
  const count = PHRASES.filter(p=>p.unit===c.key).length;
  return `<button class="cat-card" data-key="${c.key}"><div class="cat-emoji">${c.em}</div><div class="cat-name">${esc(c.name)}</div><div class="cat-count">${count} ta so'z</div></button>`;
}

function renderCategories(){
  const cats = CATEGORIES.filter(c=>c.type==='ef');
  const count = PHRASES.filter(p=>cats.some(c=>c.key===p.unit)).length;
  mainView.innerHTML = `<div class="view"><div class="section-title">📘 Lug'atlar <span class="cnt">${count} ta so'z</span></div><div class="cat-grid">${cats.map(catCardHtml).join("")}</div></div>`;
  mainView.querySelectorAll(".cat-card").forEach(c=>{ c.addEventListener("click", ()=> go("catDetail",{key:c.dataset.key})); });
}

function renderRCList(){
  const cats = CATEGORIES.filter(c=>c.type==='rc');
  const count = PHRASES.filter(p=>cats.some(c=>c.key===p.unit)).length;
  mainView.innerHTML = `<div class="view"><div class="section-title">📖 Reading Challenge <span class="cnt">${count} ta so'z/ibora</span></div><div class="cat-grid">${cats.map(catCardHtml).join("")}</div></div>`;
  mainView.querySelectorAll(".cat-card").forEach(c=>{ c.addEventListener("click", ()=> go("catDetail",{key:c.dataset.key})); });
}

function renderCatDetail(key){
  const cat = CAT_MAP[key]; const list = PHRASES.filter(p=>p.unit===key);
  mainView.innerHTML = `
  <div class="view">
    ${backRow(cat.em+" "+cat.name)}
    <div class="section-title">${list.length} ta so'z/ibora <span class="cnt">${list.filter(p=>isLearned(p.id)).length} o'rganilgan</span></div>
    <div style="display:flex; gap:10px; margin-bottom:20px;">
       <button class="btn block" id="startFlashCat">🃏 Kartochkalar</button>
       <button class="btn secondary block" id="startQuizCat">📝 Test ishlash</button>
    </div>
    <div class="phrases-list">${list.map(phraseCardHtml).join("")}</div>
  </div>`;
  attachPhraseCardEvents(mainView);
  document.getElementById("backBtn").addEventListener("click", ()=>go("categories"));
  document.getElementById("startFlashCat").addEventListener("click", ()=> go("flashRun",{ids:list.map(p=>p.id)}));
  document.getElementById("startQuizCat").addEventListener("click", ()=> startQuiz({mode:"mixed", count:Math.min(20,list.length), catKeys:[key]}));
}

function renderSearch(q){
  const results = searchPhrases(q);
  mainView.innerHTML = `
  <div class="view">
    <div class="section-title">🔎 "${esc(q)}" bo'yicha natijalar <span class="cnt">${results.length}</span></div>
    ${results.length ? `<div class="phrases-list">${results.map(phraseCardHtml).join("")}</div>` : `<div class="empty-state"><span class="em">🔍</span>Hech narsa topilmadi.<br>Boshqa so'z bilan urinib ko'ring.</div>`}
  </div>`;
  attachPhraseCardEvents(mainView);
}

function renderFavorites(){
  const ids = Object.keys(STATE.favorites).map(Number);
  const list = PHRASES.filter(p=>ids.includes(p.id));
  mainView.innerHTML = `
  <div class="view">
    <div class="section-title">⭐ Sevimli so'zlar <span class="cnt">${list.length}</span></div>
    ${list.length? `<button class="btn block" style="margin-bottom:20px;" id="flashFav">🃏 Sevimlilarni kartochka bilan o'rganish</button>` : ``}
    ${list.length? `<div class="phrases-list">${list.map(phraseCardHtml).join("")}</div>` : `<div class="empty-state"><span class="em">⭐</span>Hali sevimli so'zlar yo'q.<br>So'zlar yonidagi ☆ tugmasini bosing.</div>`}
  </div>`;
  attachPhraseCardEvents(mainView);
  if(list.length) document.getElementById("flashFav").addEventListener("click", ()=> go("flashRun",{ids:list.map(p=>p.id)}));
}

function renderStats(){
  const total = PHRASES.length; const learned = PHRASES.filter(p=>isLearned(p.id)).length;
  const memorized = PHRASES.filter(p=>isMemorized(p.id)).length; const pct = total? Math.round((learned/total)*100):0;
  const avgScore = STATE.quizScoresCount? Math.round(STATE.quizScoresSum/STATE.quizScoresCount):0;
  const byCat = CATEGORIES.map(c=>{
    const list = PHRASES.filter(p=>p.unit===c.key); const l = list.filter(p=>isLearned(p.id)).length;
    return {c, total:list.length, learned:l, pct: list.length? Math.round(l/list.length*100):0};
  }).sort((a,b)=>b.pct-a.pct);

  mainView.innerHTML = `
  <div class="view">
    <div class="section-title">📊 Statistika</div>
    <div class="dash-cards">
      <div class="stat-card"><b>🔥 ${STATE.streak}</b><span>Kunlik streak</span></div>
      <div class="stat-card"><b>${STATE.quizzesTaken}</b><span>Ishlangan testlar</span></div>
      <div class="stat-card"><b>${avgScore}%</b><span>O'rtacha natija</span></div>
      <div class="stat-card"><b>${memorized}</b><span>Mustahkam yodda</span></div>
    </div>
    <div class="stat-card" style="margin-bottom:24px;">
      <b>${pct}%</b><span>Umumiy progress (${learned}/${total} o'rganilgan)</span>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="section-title">Unitlar bo'yicha progress</div>
    <div class="phrases-list">
    ${byCat.map(x=>`
      <div class="phrase-card" style="padding:14px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <b style="font-size:13.5px;">${x.c.em}${esc(x.c.name)}</b>
          <span style="font-size:12.5px; color:var(--ink-soft); font-weight:700;">${x.learned}/${x.total}</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${x.pct}%"></div></div>
      </div>
    `).join("")}
    </div>
    <button class="btn danger block" id="resetBtn" style="margin-top: 30px;">🗑️ Statistikani tozalash</button>
  </div>`;
  document.getElementById("resetBtn").addEventListener("click", ()=>{
    if(confirm("Barcha progress, favoritlar va statistikalarni tozalashni xohlaysizmi? (Eslatma: bu faqatgina joriy qurilmadagi va tizimdagi progressni o'chiradi)")){
      STATE.favorites = {}; STATE.srs = {}; STATE.quizzesTaken = 0; STATE.quizScoresSum = 0; STATE.quizScoresCount = 0; STATE.streak = 0; STATE.lastActiveDate = null;
      saveState(); render();
    }
  });
}

let FLASH = {ids:[], idx:0, flipped:0, single:false};

function renderFlashSetup(){
  mainView.innerHTML = `
  <div class="view">
    <div class="section-title">🃏 Kartochkalar (Flashcards)</div>

let QUIZ = null;
function startQuiz(cfg){
  let chosen = [];
  if(cfg.customItems && cfg.customItems.length > 0) { chosen = shuffleSeeded(cfg.customItems, Date.now()).slice(0, cfg.count || cfg.customItems.length); } 
  else {
      let pool = cfg.catKeys && cfg.catKeys.length > 0 ? PHRASES.filter(p=>cfg.catKeys.includes(p.unit)) : PHRASES;
      if(pool.length < 4) pool = PHRASES; const count = Math.min(cfg.count, pool.length);
      chosen = shuffleSeeded(pool, Date.now()+Math.random()*1000).slice(0,count);
  }
  QUIZ = { mode: cfg.mode || 'practice', items: chosen, idx:0, correct:0, answered:false, log:[] };
  go("quizRun");
}

function buildOptions(correctPhrase, field, n=4){
  const pool = PHRASES.filter(p=>p.id!==correctPhrase.id);
  const distractors = shuffleSeeded(pool, correctPhrase.id*13+7).slice(0,n-1).map(p=>p[field]);
  return shuffleSeeded([correctPhrase[field], ...distractors], correctPhrase.id*31+3);
}

function effectiveMode(){
  if(QUIZ.mode!=="mixed") return QUIZ.mode;
  const opts = ["mcq_en2uz","mcq_uz2en","type_en","listen"]; return opts[QUIZ.idx % opts.length];
}

      });
    });
  });

  const submitBtn = document.getElementById("submitType");
  if(submitBtn){
    const inp = document.getElementById("typeInput");
    if(PRAC.autoFocus){ setTimeout(()=>inp.focus(), 50); } else { inp.blur(); }
    const submit = ()=>{
      if(QUIZ.answered) return; QUIZ.answered = true;
      const val = norm(inp.value).replace(/[.,!?]/g,""); const correctNorm = norm(p.en).replace(/[.,!?]/g,"");
      const isCorrect = val.length>0 && (val===correctNorm || (correctNorm.includes(val) && val.length>=correctNorm.length*0.7));
      answerFeedback(p, isCorrect, mode); inp.disabled = true; submitBtn.disabled = true;
    };
    submitBtn.addEventListener("click", submit); inp.addEventListener("keydown",(e)=>{ if(e.key==="Enter") submit(); });
  }
}

function answerFeedback(p, isCorrect, mode){
  if(isCorrect){ QUIZ.correct++; markKnown(p.id); } else { markUnknown(p.id); }
  QUIZ.log.push({id:p.id, ok:isCorrect});
  
  // Real-vaqt render uzilishining oldini olamiz (test ishlanayotganda STATE faqat orqa fonda saqlanadi)
  saveState();
  
  document.getElementById("fbSlot").innerHTML = `
    <div class="q-feedback ${isCorrect?'ok':'no'}" style="padding:16px; border-radius: 14px; background: ${isCorrect?'rgba(31,191,117,0.12)':'rgba(255,77,94,0.12)'}; font-size:15px; margin-top:20px; font-weight:700; color: ${isCorrect?'var(--success)':'var(--danger)'};">
       ${isCorrect? '✅ To\'g\'ri!' : '❌ Noto\'g\'ri.'}<div class="fb-note" style="margin-top:6px; font-size:14px; color:var(--ink);">${esc(p.en)} — ${esc(p.uz)}${p.ru?' · 🇷🇺 '+esc(p.ru):''}${p.note?' · '+esc(p.note):''}</div>
    </div>
    <button class="btn block" id="nextQ" style="margin-top:20px; padding:16px;">${QUIZ.idx+1>=QUIZ.items.length?'Natijani ko\'rish →':'Keyingi savol →'}</button>
  `;
  document.getElementById("nextQ").addEventListener("click", ()=>{ QUIZ.idx++; render(); });
}

function finishQuiz(){
  const total = QUIZ.items.length; const pct = total? Math.round((QUIZ.correct/total)*100):0;
  STATE.quizzesTaken++; STATE.quizScoresSum += pct; STATE.quizScoresCount++; saveState();
  VIEW = "quizResult"; renderQuizResult(pct);
}

function renderQuizResult(pctArg){
  const total = QUIZ.items.length; const pct = pctArg!==undefined ? pctArg : (total? Math.round((QUIZ.correct/total)*100):0);
  const wrongItems = QUIZ.log.filter(l=>!l.ok).map(l=>PHRASES[l.id]);
  let msg = "Ajoyib natija! 🎉"; if(pct<50) msg = "Mashq qilishda davom eting! 💪"; else if(pct<80) msg = "Yaxshi, lekin yanada yaxshilash mumkin. 👍";

  mainView.innerHTML = `
  <div class="view">
    <div class="result-hero" style="max-width: 600px; margin: 0 auto; text-align:center;">
      <div class="result-ring" style="width:160px; height:160px; margin: 0 auto 20px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex-direction:column; border: 8px solid var(--primary); box-shadow:var(--shadow-lg);"><div><b style="font-size:40px;">${pct}%</b><div style="font-size:14px; color:var(--ink-soft); font-weight:700;">${QUIZ.correct}/${total}</div></div></div>
      <h2 style="font-size:24px; margin-bottom:20px;">${msg}</h2>
    </div>
    ${wrongItems.length? `
      <div class="section-title">❌ Xato qilingan so'zlar (${wrongItems.length})</div>
      <button class="btn danger block" id="rRetryWrong" style="margin-bottom:20px; padding:16px; background:linear-gradient(135deg,#FFB020,#FF4D5E);">🔁 Faqat xatolarni qayta ishlash</button>
      <div class="phrases-list">${wrongItems.map(phraseCardHtml).join("")}</div>
    `:``}
    <div style="display:flex; gap:15px; margin-top:24px; justify-content:center; max-width: 600px; margin: 24px auto 0;">
      <button class="btn secondary" id="rHome" style="flex:1;">🏠 Bosh sahifa</button>
      <button class="btn" id="rAgain" style="flex:1;">🔁 Yana test</button>
    </div>
  </div>`;
  
  attachPhraseCardEvents(mainView);
  document.getElementById("rHome").addEventListener("click", ()=>go("home"));
  document.getElementById("rAgain").addEventListener("click", ()=>go("quiz"));
  
  const retryBtn = document.getElementById("rRetryWrong");
  if(retryBtn) { retryBtn.addEventListener("click", () => { startQuiz({ mode: QUIZ.mode, customItems: wrongItems, count: wrongItems.length }); }); }
}

// Boshlang'ich yuklanish
go("home");
</script>

<!-- FIREBASE CLOUD SYNC & REALTIME DATABASE -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyDNjDE8VKvaM8fahdTd_TuECKmp13Ksr8I",
        authDomain: "english-148c0.firebaseapp.com",
        projectId: "english-148c0",
        storageBucket: "english-148c0.firebasestorage.app",
        messagingSenderId: "843459344567",
        appId: "1:843459344567:web:1085bc442ff09bc1f4b532"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    window.isCloudLoaded = false;
    let unsubSnapshot = null;

    // Yozish tizimi faqat user ro'yxatdan o'tgan bo'lsagina ishlaydi
    window.syncToFirestore = () => {
        if (window.currentUser && db && window.isCloudLoaded) {
            const userData = {
                favorites: STATE.favorites,
                srs: STATE.srs,
                quizzesTaken: STATE.quizzesTaken,
                quizScoresSum: STATE.quizScoresSum,
                quizScoresCount: STATE.quizScoresCount,
                lastActiveDate: STATE.lastActiveDate,
                streak: STATE.streak
            };
            setDoc(doc(db, "users", window.currentUser.uid), userData, { merge: true }).catch(e => console.error("Firestore Error:", e));
        }
    };

    const showAuthBtn = document.getElementById('show-auth-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userInfo = document.getElementById('user-info');
    const authModal = document.getElementById('auth-modal');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const authError = document.getElementById('auth-error');
    const forgotPasswordBtn = document.getElementById('forgot-password');
    const googleBtn = document.getElementById('google-btn');

    if(showAuthBtn) showAuthBtn.addEventListener('click', () => { authModal.style.display = 'flex'; });
    if(closeModalBtn) closeModalBtn.addEventListener('click', () => { authModal.style.display = 'none'; });
    window.addEventListener('click', (e) => { if (e.target === authModal) authModal.style.display = 'none'; });

    if(document.getElementById('signup-btn')) {
        document.getElementById('signup-btn').addEventListener('click', () => {
            createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
                .then(() => { authModal.style.display = 'none'; })
                .catch((error) => { authError.style.color = "red"; authError.textContent = "Xatolik: " + error.message; });
        });
    }

    if(document.getElementById('login-btn')) {
        document.getElementById('login-btn').addEventListener('click', () => {
            signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
                .then(() => { authModal.style.display = 'none'; })
                .catch((error) => { authError.style.color = "red"; authError.textContent = "Email yoki parol noto'g'ri!"; });
        });
    }
    
    if(googleBtn) {
        googleBtn.addEventListener('click', () => {
            signInWithPopup(auth, googleProvider)
                .then(() => { authModal.style.display = 'none'; })
                .catch((error) => {
                    if(error.code !== 'auth/popup-closed-by-user') {
                        authError.style.color = "red"; 
                        authError.textContent = "Xatolik: " + error.message; 
                    }
                });
        });
    }

    if(forgotPasswordBtn) {
        forgotPasswordBtn.addEventListener('click', () => {
            if(!emailInput.value) { authError.style.color = "red"; authError.textContent = "Avval emailingizni yozing, keyin 'Parolni unutdingizmi?' ni bosing!"; return; }
            sendPasswordResetEmail(auth, emailInput.value)
                .then(() => { authError.style.color = "green"; authError.textContent = "Parolni tiklash havolasi emailingizga yuborildi. Pochtani tekshiring!"; })
                .catch((error) => { authError.style.color = "red"; authError.textContent = "Xatolik: " + error.message; });
        });
    }

    if(logoutBtn) {
        logoutBtn.addEventListener('click', () => {
            window.isCloudLoaded = false;
            if (unsubSnapshot) { unsubSnapshot(); unsubSnapshot = null; }
            
            // Faqat progressni tozalaymiz. Rang, V1 va Mavzu (theme) o'zgarmasdan qoladi.
            STATE.favorites = {};
            STATE.srs = {};
            STATE.quizzesTaken = 0;
            STATE.quizScoresSum = 0;
            STATE.quizScoresCount = 0;
            STATE.lastActiveDate = null;
            STATE.streak = 0;
            
            localStorage.setItem(LS_KEY, JSON.stringify(STATE));
            
            if(window.goView) window.goView("home");
            signOut(auth); 
        });
    }

    onAuthStateChanged(auth, (user) => {
        if (user) {
            if(showAuthBtn) showAuthBtn.style.display = 'none';
            if(userInfo) { userInfo.style.display = 'inline'; userInfo.textContent = user.email || 'Foydalanuvchi'; }
            if(logoutBtn) logoutBtn.style.display = 'inline';
            
            window.currentUser = user; 
            window.isCloudLoaded = false; 
            
            const docRef = doc(db, "users", user.uid);
            
            // REAL-TIME LISTENER: Har gal biror joyda ma'lumot yangilansa...
            unsubSnapshot = onSnapshot(docRef, (docSnap) => {
                if(docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // Faqat foydalanuvchi progressini yangilaymiz. (theme va colorIdx ni TEGMAYMIZ)
                    STATE.favorites = data.favorites || {};
                    STATE.srs = data.srs || {};
                    STATE.quizzesTaken = data.quizzesTaken || 0;
                    STATE.quizScoresSum = data.quizScoresSum || 0;
                    STATE.quizScoresCount = data.quizScoresCount || 0;
                    if(data.lastActiveDate) STATE.lastActiveDate = data.lastActiveDate;
                    if(data.streak) STATE.streak = data.streak;

                    localStorage.setItem(LS_KEY, JSON.stringify(STATE));
                    window.isCloudLoaded = true; 
                    
                    // XATOLIK SABABI VA YECHIMI:
                    // Agar test ishlanayotgan bo'lsa, UI yangilanishiga (render) RUXSAT BERMAYMIZ. 
                    // Aks holda test o'zidan o'zi boshlang'ich holatiga (javobsiz holatga) reset bo'lib qoladi.
                    if (VIEW !== "quizRun" && VIEW !== "flashRun" && VIEW !== "practiceRun") {
                        if(typeof render === 'function') render();
                    }
                } else {
                    // Yangi foydalanuvchi
                    window.isCloudLoaded = true;
                    window.syncToFirestore();
                }
            }, (error) => {
                console.error("Real-time Sync Xatosi:", error);
                window.isCloudLoaded = false;
            });
            
        } else {
            window.isCloudLoaded = false;
            if (unsubSnapshot) { unsubSnapshot(); unsubSnapshot = null; }
            if(showAuthBtn) showAuthBtn.style.display = 'inline';
            if(userInfo) { userInfo.style.display = 'none'; userInfo.textContent = ''; }
            if(logoutBtn) logoutBtn.style.display = 'none';
            emailInput.value = ''; passwordInput.value = ''; authError.textContent = '';
            window.currentUser = null;
        }
    });
</script>
</body>
</html>
