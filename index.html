<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ingliz tili lug'ati — English File Units</title>
<style>
:root{--bg:#F6F5FB;--surface:#FFFFFF;--surface-2:#EFEDFB;--ink:#20203A;--ink-soft:#5B5B78;--border:rgba(32,32,58,0.10);--primary:#5B4CFF;--primary-2:#8B5CF6;--accent:#FF6F91;--accent-2:#00C6AE;--gold:#FFB020;--danger:#FF4D5E;--success:#1FBF75;--shadow: 0 8px 24px rgba(60,50,140,0.10);--shadow-lg: 0 16px 40px rgba(60,50,140,0.18);--radius: 18px;--radius-sm: 12px;--grad-1: linear-gradient(135deg,#5B4CFF 0%,#8B5CF6 50%,#FF6F91 100%);--grad-2: linear-gradient(135deg,#00C6AE 0%,#5B4CFF 100%);--font-display: 'Golos Text','Segoe UI',system-ui,sans-serif;--font-body: 'Golos Text','Segoe UI',system-ui,sans-serif;}
html.dark{--bg:#1D1D26;--surface:#262633;--surface-2:#323244;--ink:#F1F0FA;--ink-soft:#A8A6C6;--border:rgba(255,255,255,0.08);--shadow: 0 8px 24px rgba(0,0,0,0.35);--shadow-lg: 0 16px 40px rgba(0,0,0,0.5);}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--ink);transition:background .3s,color .3s;}
h1,h2,h3{font-family:var(--font-display); margin:0;}
button{font-family:inherit; cursor:pointer;}
input,select{font-family:inherit;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
.app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;padding-bottom:76px;}
.topbar{position:sticky; top:0; z-index:40;background:var(--grad-1);padding:16px 18px 22px;border-radius:0 0 26px 26px;box-shadow:var(--shadow-lg);color:#fff;}
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;font-size:20px;backdrop-filter: blur(6px);}
.brand-text h1{font-size:16px; font-weight:800; letter-spacing:.2px;}
.brand-text p{margin:2px 0 0; font-size:11.5px; opacity:.85;}
.topbar-actions{display:flex; gap:8px;}
.icon-btn{width:38px;height:38px;border-radius:12px;border:none;background:rgba(255,255,255,0.16);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;transition: transform .15s, background .2s;}
.icon-btn:active{transform:scale(0.9);}
.icon-btn.on{background:rgba(255,255,255,0.35);}
.streak-pill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.18);padding:6px 10px;border-radius:100px;font-size:12.5px;font-weight:700;}
.search-wrap{margin-top:14px;position:relative;}
.search-input{width:100%; padding:13px 44px 13px 16px; border-radius:14px; border:none;background:rgba(255,255,255,0.92); font-size:14.5px; color:#20203A; outline:none;}
.search-input::placeholder{color:#8E8DA8;}
.search-clear{position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none;border:none;color:#8E8DA8;font-size:18px;padding:6px;display:none;}
.view{padding:16px 16px 8px; animation: fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.section-title{font-size:15px;font-weight:800; margin:6px 2px 12px; display:flex; align-items:center; gap:8px;}
.section-title .cnt{font-weight:600;font-size:11.5px;color:var(--ink-soft); background:var(--surface-2); padding:3px 9px;border-radius:100px;}
.cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
.cat-card{background:var(--surface); border-radius:var(--radius-sm); padding:14px; box-shadow:var(--shadow);border:1px solid var(--border); text-align:left; display:flex; flex-direction:column; gap:8px; color:var(--ink);transition: transform .15s;}
.cat-card:active{transform:scale(0.96);}
.cat-emoji{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px; background:var(--surface-2);}
.cat-name{font-size:13px;font-weight:700; line-height:1.25;}
.cat-count{font-size:11px;color:var(--ink-soft); font-weight:600;}
.dash-cards{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
.stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px; box-shadow:var(--shadow);}
.stat-card b{font-size:22px; display:block;}
.stat-card span{font-size:11.5px; color:var(--ink-soft); font-weight:600;}
.progress-bar{height:8px;border-radius:10px; background:var(--surface-2); overflow:hidden; margin-top:8px;}
.progress-fill{height:100%; background:var(--grad-2); border-radius:10px; transition:width .4s;}
.quick-row{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; margin-bottom:18px;}
.quick-btn{flex:0 0 auto; background:var(--surface); border:1px solid var(--border); border-radius:14px;padding:12px 16px; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:92px;box-shadow:var(--shadow); font-size:11.5px; font-weight:700; color:var(--ink);}
.quick-btn .em{font-size:20px;}
.quick-btn:active{transform:scale(0.95);}
.phrase-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);padding:14px 14px; margin-bottom:10px; box-shadow:var(--shadow); position:relative;}
.phrase-uz{font-size:11.5px; color:var(--primary); font-weight:800; text-transform:uppercase; letter-spacing:.3px; margin-bottom:4px;}
.phrase-ru{font-size:16px; font-weight:700; line-height:1.35; margin-bottom:3px;}
.phrase-tr{font-size:12.5px; color:var(--ink-soft); font-style:italic; margin-bottom:4px;}
.phrase-note{font-size:11.5px; color:var(--accent-2); font-weight:600;}
.phrase-actions{position:absolute; top:10px; right:10px; display:flex; gap:6px;}
.mini-btn{width:32px;height:32px;border-radius:10px;border:none;background:var(--surface-2);display:flex;align-items:center;justify-content:center; font-size:15px; color:var(--ink-soft);}

.bottom-nav{position:fixed; bottom:0; left:0; right:0; z-index:50;background:var(--surface); border-top:1px solid var(--border);display:flex; justify-content:space-around; padding:8px 4px calc(8px + env(safe-area-inset-bottom));max-width:720px; margin:0 auto; box-shadow:0 -6px 20px rgba(0,0,0,0.06);}

.nav-btn.active{color:var(--primary);}

.btn:active{transform:scale(0.97);}
.btn.secondary{background:var(--surface-2); color:var(--ink); box-shadow:none; border:1px solid var(--border);}
.btn.block{width:100%;}

.flash-progress{width:100%; display:flex; align-items:center; gap:10px; margin-bottom:16px; font-size:12px; color:var(--ink-soft); font-weight:700;}

.flash-progress .bar i{display:block; height:100%; background:var(--grad-1);}
.flashcard{width:100%; min-height:260px; border-radius:22px; background:var(--surface); box-shadow:var(--shadow-lg);border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center;text-align:center; padding:30px 22px; position:relative; perspective:1200px;}
.flash-cat{position:absolute; top:14px; left:16px; font-size:10.5px; font-weight:800; color:var(--ink-soft); background:var(--surface-2); padding:4px 10px; border-radius:100px;}

.q-progress{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
.q-progress .bar{flex:1; height:8px; background:var(--surface-2); border-radius:10px; overflow:hidden;}
.q-progress .bar i{display:block; height:100%; background:var(--grad-1);}
.q-score{font-size:12px; font-weight:800; color:var(--ink-soft);}
.q-card{background:var(--surface); border-radius:20px; box-shadow:var(--shadow-lg); border:1px solid var(--border); padding:24px 20px; text-align:center;}
.q-label{font-size:11px; font-weight:800; color:var(--primary); text-transform:uppercase; letter-spacing:.4px; margin-bottom:10px;}
.q-question{font-size:20px; font-weight:800; line-height:1.4; margin-bottom:6px;}
.q-question .em-audio{margin-left:8px;}
.q-options{display:flex; flex-direction:column; gap:10px; margin-top:18px;}
.opt-btn{padding:14px 16px; border-radius:14px; border:2px solid var(--border); background:var(--surface);text-align:left; font-size:14px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:10px;}

.opt-btn.correct{border-color:var(--success); background:rgba(31,191,117,0.12);}

.type-input{width:100%; padding:14px 16px; border-radius:14px; border:2px solid var(--border); background:var(--surface); font-size:15px; margin-top:16px; color:var(--ink); outline:none;}
.type-input:focus{border-color:var(--primary);}
.q-feedback{margin-top:14px; padding:12px 14px; border-radius:14px; font-size:13px; font-weight:700; text-align:left;}
.q-feedback.ok{background:rgba(31,191,117,0.12); color:var(--success);}
.q-feedback.no{background:rgba(255,77,94,0.12); color:var(--danger);}
.q-feedback .fb-note{display:block; margin-top:4px; font-weight:600; color:var(--ink-soft);}
.result-hero{text-align:center; padding:30px 10px 20px;}
.result-ring{width:140px;height:140px; border-radius:50%; margin:0 auto 16px; display:flex; align-items:center; justify-content:center; background:var(--grad-1); box-shadow:var(--shadow-lg);}
.result-ring b{font-size:32px; color:#fff;}
.result-ring span{font-size:11px; color:rgba(255,255,255,0.85); display:block;}
.tag-row{display:flex; gap:8px; flex-wrap:wrap; padding:2px 4px 10px 0; max-height:220px; overflow-y:auto; align-content:flex-start;}
.tag-chip{padding:8px 14px; border-radius:100px; background:var(--surface); border:1px solid var(--border); font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:4px;}
.tag-chip.sel{background:var(--primary); color:#fff; border-color:var(--primary);}
.back-row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.back-btn{width:36px;height:36px;border-radius:11px; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--ink);}
.source-note{font-size:11px; color:var(--ink-soft); background:var(--surface-2); border-radius:12px; padding:10px 12px; margin-bottom:14px; line-height:1.5;}
@media (min-width:480px){.cat-grid{grid-template-columns:1fr 1fr 1fr;}}

<div class="app" id="app">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <div class="brand-mark">🇬🇧</div>
        <div class="brand-text">
          <h1>Ingliz tili lug'ati</h1>
          <p>English File — Unit lug'atlari</p>
        </div>
      </div>

    </div>

    <button class="nav-btn" data-view="rclist"><span class="em">📖</span>Reading C.</button>

<!-- LUG'ATLAR BAZASI ULANDI -->
<script src="words.js"></script>

<script>
PHRASES.forEach((p,i)=>{ p.id = i; });
const CAT_MAP = Object.fromEntries(CATEGORIES.map(c=>[c.key,c]));

const LS_KEY = "eng_vocab_state_v1";
function loadState(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return { favorites:{}, srs:{}, quizzesTaken:0, quizScoresSum:0, quizScoresCount:0, theme:"light", lastActiveDate:null, streak:0 };
}
let STATE = loadState();
function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }

function todayStr(){ return new Date().toISOString().slice(0,10); }
function bumpStreak(){
  const t = todayStr();
  if(STATE.lastActiveDate === t) return;
  if(STATE.lastActiveDate){
    const prev = new Date(STATE.lastActiveDate);
    const now = new Date(t);
    const diffDays = Math.round((now-prev)/86400000);
    STATE.streak = (diffDays===1) ? (STATE.streak+1) : 1;
  } else { STATE.streak = 1; }
  STATE.lastActiveDate = t;
  saveState();
}
bumpStreak();

if(STATE.theme === "dark"){ document.documentElement.classList.add("dark"); }
function applyThemeIcon(){ document.getElementById("themeBtn").textContent = STATE.theme==="dark" ? "☀️" : "🌙"; }

const SRS_INTERVALS_MIN = [10, 60, 60*8, 60*24, 60*24*3, 60*24*7, 60*24*16, 60*24*30];
function getSrs(id){ return STATE.srs[id] || {box:0, next:0}; }
function markKnown(id){
  const s = getSrs(id);
  s.box = Math.min(s.box+1, SRS_INTERVALS_MIN.length-1);
  s.next = Date.now() + SRS_INTERVALS_MIN[s.box]*60000;
  STATE.srs[id] = s; saveState();
}
function markUnknown(id){
  const s = getSrs(id);
  s.box = 0; s.next = Date.now() + SRS_INTERVALS_MIN[0]*60000;
  STATE.srs[id] = s; saveState();
}
function isLearned(id){ return getSrs(id).box >= 3; }
function isMemorized(id){ return getSrs(id).box >= 5; }
function dueForReview(id){ const s = getSrs(id); return s.box>0 && s.next <= Date.now(); }

let EN_VOICE = null;
function pickVoice(){
  const voices = speechSynthesis.getVoices();
  EN_VOICE = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("en-gb")) || voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("en")) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-GB";
  if(EN_VOICE) u.voice = EN_VOICE;
  u.rate = 0.92;
  speechSynthesis.speak(u);
}

let VIEW = "home";
let VIEW_PARAMS = {};
const mainView = document.getElementById("mainView");

function go(view, params={}){
  VIEW = view; VIEW_PARAMS = params;
  document.querySelectorAll(".nav-btn").forEach(b=>{
    b.classList.toggle("active", b.dataset.view === (["home","categories","rclist","flash","quiz","favorites","stats"].includes(view)?view:""));
  });
  render();
  window.scrollTo({top:0, behavior:"instant"});
}

document.querySelectorAll(".nav-btn").forEach(btn=>{ btn.addEventListener("click", ()=> go(btn.dataset.view)); });
document.getElementById("themeBtn").addEventListener("click", ()=>{
  STATE.theme = STATE.theme==="dark" ? "light" : "dark";
  document.documentElement.classList.toggle("dark", STATE.theme==="dark");
  applyThemeIcon(); saveState();
});
applyThemeIcon();

const searchInput = document.getElementById("globalSearch");
const searchClear = document.getElementById("searchClear");
searchInput.addEventListener("input", ()=>{
  searchClear.style.display = searchInput.value ? "block" : "none";
  if(searchInput.value.trim().length>0) go("search", {q:searchInput.value.trim()});
  else if(VIEW==="search") go("home");
});
searchClear.addEventListener("click", ()=>{ searchInput.value=""; searchClear.style.display="none"; go("home"); });

function esc(s){ return (s||"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function norm(s){ return (s||"").toLowerCase().replace(/[ʼ'`’]/g,"'").trim(); }
function searchPhrases(q){
  const nq = norm(q);
  if(!nq) return [];
  return PHRASES.filter(p=> norm(p.en).includes(nq) || norm(p.uz).includes(nq) || norm(p.ru).includes(nq) ).slice(0,200);
}

function phraseCardHtml(p){
  const fav = !!STATE.favorites[p.id];
  return `

function dailyPhrase(){
  const seedStr = todayStr();
  let seed=0; for(const ch of seedStr) seed += ch.charCodeAt(0)*7;
  return PHRASES[seed % PHRASES.length];
}

function shuffleSeeded(arr, seed){
  const a = arr.slice(); let s = seed || 1;
  function rnd(){ s = (s*9301+49297)%233280; return s/233280; }
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

  document.getElementById("backBtn").addEventListener("click", ()=>go("flash"));

    if(e.target.id==="flashStar" || e.target.id==="flashSpeak") return;

let QUIZ = null;
function startQuiz(cfg){
  let chosen = [];
  if(cfg.customItems && cfg.customItems.length > 0) {
      chosen = shuffleSeeded(cfg.customItems, Date.now()).slice(0, cfg.count || cfg.customItems.length);
  } else {
      let pool = cfg.catKeys && cfg.catKeys.length > 0 ? PHRASES.filter(p=>cfg.catKeys.includes(p.unit)) : PHRASES;
      if(pool.length < 4) pool = PHRASES;
      const count = Math.min(cfg.count, pool.length);
      chosen = shuffleSeeded(pool, Date.now()+Math.random()*1000).slice(0,count);
  }
  QUIZ = { mode: cfg.mode || 'practice', items: chosen, idx:0, correct:0, answered:false, log:[] };
  go("quizRun");
}

function buildOptions(correctPhrase, field, n=4){
  const pool = PHRASES.filter(p=>p.id!==correctPhrase.id);
  const distractors = shuffleSeeded(pool, correctPhrase.id*13+7).slice(0,n-1).map(p=>p[field]);
  return shuffleSeeded([correctPhrase[field], ...distractors], correctPhrase.id*31+3);
}

function effectiveMode(){
  if(QUIZ.mode!=="mixed") return QUIZ.mode;
  const opts = ["mcq_en2uz","mcq_uz2en","type_en","listen"];
  return opts[QUIZ.idx % opts.length];
}

let PRAC = { reversed: false, streak: 0, autoFocus: false };
function renderPracticeRun(){

  if(QUIZ.idx < 0) QUIZ.idx = 0;

  const targetText = PRAC.reversed ? p.uz : p.en;

        <div style="display:flex; gap:6px; align-items:center;">
          <button class="btn secondary" id="pracAutoToggle" style="padding:6px 10px; font-size:11.5px; border-radius:8px; font-weight:700;">⌨️ ${PRAC.autoFocus?'Aktiv':'Passiv'}</button>
          <button class="btn secondary" id="pracToggle" style="padding:6px 10px; font-size:11.5px; border-radius:8px; font-weight:700;">🔁 ${PRAC.reversed?'EN → UZ':'UZ → EN'}</button>
          <span style="font-size:12px; color:var(--ink-soft); font-weight:600;">${QUIZ.idx+1} / ${QUIZ.items.length}</span>
        </div>
      </div>
      <div style="background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:20px 14px; text-align:center; margin-bottom:16px;">
        <div style="font-size:12px; color:var(--ink-soft); margin-bottom:8px;">Bu so'zning ${PRAC.reversed?'o\'zbekchasi':'inglizchasi'} nima?</div>
        <div style="display:flex; align-items:center; justify-content:center; gap:10px;">
          <div style="font-family:'Golos Text',sans-serif; font-weight:800; font-size:18px; line-height:1.3;">${esc(primaryText)}</div>
          <button type="button" class="mini-btn" id="pracSpeak" style="background:#B8863B; color:#fff; width:36px; height:36px; border-radius:50%; flex:none;">🔊</button>
        </div>
      </div>
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <input type="text" id="pracInput" placeholder="${PRAC.reversed?'o\'zbekcha':'inglizcha'} yozing..." autocomplete="off" style="flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:var(--bg); font-size:15px; outline:none; color:var(--ink); width:100%; min-width:0;">
        <button id="pracSubmit" style="background:var(--grad-1); color:#fff; border:none; border-radius:10px; padding:0 16px; font-size:14px; font-family:var(--font-body); font-weight:700; cursor:pointer;">Tekshirish</button>
      </div>
      <div id="pracFeedback" style="min-height:24px; font-size:14px; font-weight:600; margin-bottom:12px; line-height:1.3;"></div>
      <div style="display:flex; gap:8px; margin-bottom:12px;">

      </div>
      <div style="display:flex; gap:8px;">
        <button id="pracPrev" style="flex:1; background:var(--surface-2); color:var(--ink); border:1px solid var(--border); border-radius:10px; padding:12px; font-size:14px; font-family:var(--font-body); font-weight:700; cursor:pointer;">← Oldingisi</button>
        <button id="pracNext" style="flex:1; background:var(--surface-2); color:var(--ink); border:1px solid var(--border); border-radius:10px; padding:12px; font-size:14px; font-family:var(--font-body); font-weight:700; cursor:pointer;">Keyingisi →</button>
      </div>
      <div style="display:flex; justify-content:space-between; margin-top:16px; padding-top:12px; border-top:1px solid var(--border); font-size:13px; color:rgba(40,50,74,0.7); font-weight:600;">

  document.getElementById("pracToggle").addEventListener("click", ()=>{ PRAC.reversed = !PRAC.reversed; renderPracticeRun(); });
  document.getElementById("pracAutoToggle").addEventListener("click", ()=>{ PRAC.autoFocus = !PRAC.autoFocus; renderPracticeRun(); });

     if(userNorm.length > 0 && (userNorm === targetNorm || (targetNorm.includes(userNorm) && userNorm.length >= targetNorm.length*0.7))){

     }

  document.getElementById("pracNext").addEventListener("click", ()=>{ QUIZ.idx++; renderPracticeRun(); });
}

function renderQuizRun(){
  if(QUIZ.mode === 'practice'){ return renderPracticeRun(); }
  if(QUIZ.idx >= QUIZ.items.length){ return finishQuiz(); }
  const p = QUIZ.items[QUIZ.idx]; const mode = effectiveMode(); const pct = Math.round((QUIZ.idx/QUIZ.items.length)*100); QUIZ.answered = false;

  let bodyHtml = "";
  if(mode==="mcq_en2uz" || mode==="listen"){
    const opts = buildOptions(p,"uz");
    const questionText = mode==="listen" ? `🎧 Tinglang va to'g'ri tarjimani tanlang` : esc(p.en);
    bodyHtml = `
      <div class="q-label">${mode==="listen"?"Tinglab topish":"Inglizchasini → o'zbekchasini toping"}</div>
      <div class="q-question">${questionText} ${mode==="listen"?`<button class="mini-btn" id="playAudio" style="display:inline-flex;">🔊</button>`:``}</div>
      ${mode==="listen"?`<div style="font-size:12px;color:var(--ink-soft);">(${esc(p.en)})</div>`:``}
      <div class="q-options">${opts.map((o,i)=>`<button class="opt-btn" data-val="${esc(o)}"><span class="letter">${"ABCD"[i]}</span>${esc(o)}</button>`).join("")}</div>`;
  } else if(mode==="mcq_uz2en"){
    const opts = buildOptions(p,"en");
    bodyHtml = `
      <div class="q-label">O'zbekchasini → inglizchasini toping</div>
      <div class="q-question">${esc(p.uz)}</div>
      ${p.ru?`<div style="font-size:12.5px;color:var(--ink-soft);font-style:italic;">🇷🇺 ${esc(p.ru)}</div>`:``}
      <div class="q-options">${opts.map((o,i)=>`<button class="opt-btn" data-val="${esc(o)}"><span class="letter">${"ABCD"[i]}</span>${esc(o)}</button>`).join("")}</div>`;
  } else if(mode==="type_en"){
    bodyHtml = `
      <div class="q-label">Inglizcha so'z/iborani yozing</div>
      <div class="q-question">${esc(p.uz)}</div>
      <input type="text" class="type-input" id="typeInput" placeholder="Bu yerga inglizcha yozing..." autocomplete="off">
      <button class="btn block" id="submitType" style="margin-top:12px;">✔️ Javobni tekshirish</button>`;
  }

  mainView.innerHTML = `
  <div class="view">
    ${backRow("Test")}
    <div class="q-progress"><span class="q-score">✅ ${QUIZ.correct}/${QUIZ.idx}</span><div class="bar"><i style="width:${pct}%"></i></div><span class="q-score">${QUIZ.idx+1}/${QUIZ.items.length}</span></div>
    <div class="q-card">${bodyHtml}<div id="fbSlot"></div></div>
  </div>`;

  document.getElementById("backBtn").addEventListener("click", ()=>{ if(confirm("Testni tark etasizmi? Natija saqlanmaydi.")) go("quiz"); });
  const playBtn = document.getElementById("playAudio");
  if(playBtn) playBtn.addEventListener("click", (e)=>{ e.stopPropagation(); speak(p.en); });
  if(mode==="listen") speak(p.en);

  mainView.querySelectorAll(".opt-btn").forEach(b=>{
    b.addEventListener("click", ()=>{
      if(QUIZ.answered) return;
      QUIZ.answered = true;
      const correctVal = mode==="mcq_uz2en" ? p.en : p.uz; const isCorrect = b.dataset.val === correctVal;
      answerFeedback(p, isCorrect, mode);
      mainView.querySelectorAll(".opt-btn").forEach(o=>{
        o.disabled = true;
        if(o.dataset.val === correctVal) o.classList.add("correct"); else if(o===b && !isCorrect) o.classList.add("wrong");
      });
    });
  });

  const submitBtn = document.getElementById("submitType");
  if(submitBtn){
    const inp = document.getElementById("typeInput");
    if(PRAC.autoFocus){ setTimeout(()=>inp.focus(), 50); } else { inp.blur(); }
    const submit = ()=>{
      if(QUIZ.answered) return; QUIZ.answered = true;
      const val = norm(inp.value).replace(/[.,!?]/g,""); const correctNorm = norm(p.en).replace(/[.,!?]/g,"");
      const isCorrect = val.length>0 && (val===correctNorm || (correctNorm.includes(val) && val.length>=correctNorm.length*0.7));
      answerFeedback(p, isCorrect, mode); inp.disabled = true; submitBtn.disabled = true;
    };
    submitBtn.addEventListener("click", submit);
    inp.addEventListener("keydown",(e)=>{ if(e.key==="Enter") submit(); });
  }
}

function answerFeedback(p, isCorrect, mode){
  if(isCorrect){ QUIZ.correct++; markKnown(p.id); } else { markUnknown(p.id); }
  QUIZ.log.push({id:p.id, ok:isCorrect});
  document.getElementById("fbSlot").innerHTML = `
    <div class="q-feedback ${isCorrect?'ok':'no'}">${isCorrect? '✅ To\'g\'ri!' : '❌ Noto\'g\'ri.'}<span class="fb-note">${esc(p.en)} — ${esc(p.uz)}${p.ru?' · 🇷🇺 '+esc(p.ru):''}${p.note?' · '+esc(p.note):''}</span></div>
    <button class="btn block" id="nextQ" style="margin-top:14px;">${QUIZ.idx+1>=QUIZ.items.length?'Natijani ko\'rish →':'Keyingi savol →'}</button>
  `;
  document.getElementById("nextQ").addEventListener("click", ()=>{ QUIZ.idx++; render(); });
}

function finishQuiz(){
  const total = QUIZ.items.length; const pct = total? Math.round((QUIZ.correct/total)*100):0;
  STATE.quizzesTaken++; STATE.quizScoresSum += pct; STATE.quizScoresCount++; saveState();
  VIEW = "quizResult"; renderQuizResult(pct);
}

function renderQuizResult(pctArg){
  const total = QUIZ.items.length; const pct = pctArg!==undefined ? pctArg : (total? Math.round((QUIZ.correct/total)*100):0);
  const wrongItems = QUIZ.log.filter(l=>!l.ok).map(l=>PHRASES[l.id]);
  let msg = "Ajoyib natija! 🎉"; if(pct<50) msg = "Mashq qilishda davom eting! 💪"; else if(pct<80) msg = "Yaxshi, lekin yanada yaxshilash mumkin. 👍";

  mainView.innerHTML = `
  <div class="view">
    <div class="result-hero"><div class="result-ring"><div><b>${pct}%</b><span>${QUIZ.correct}/${total}</span></div></div><h2 style="font-size:18px;">${msg}</h2></div>
    ${wrongItems.length? `
      <div class="section-title">❌ Xato javoblar (${wrongItems.length})</div>
      <button class="btn danger block" id="rRetryWrong" style="margin-bottom:14px; background:linear-gradient(135deg,#FFB020,#FF4D5E);">🔁 Faqat xatolarni qayta ishlash</button>
      ${wrongItems.map(phraseCardHtml).join("")}
    `:``}
    <div style="display:flex; gap:10px; margin-top:16px;">
      <button class="btn secondary block" id="rHome">🏠 Bosh sahifa</button>
      <button class="btn block" id="rAgain">🔁 Yana test</button>
    </div>
  </div>`;
  
  attachPhraseCardEvents(mainView);
  document.getElementById("rHome").addEventListener("click", ()=>go("home"));
  document.getElementById("rAgain").addEventListener("click", ()=>go("quiz"));
  
  const retryBtn = document.getElementById("rRetryWrong");
  if(retryBtn) { retryBtn.addEventListener("click", () => { startQuiz({ mode: QUIZ.mode, customItems: wrongItems, count: wrongItems.length }); }); }
}

go("home");
</script>
